$kind: http-request
name: 'DELETE /api/resources/{{resource_id}}'
method: DELETE
url: '{{base_url}}/api/resources/{{resource_id}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", function () {
          pm.response.to.have.status(204);
      });
